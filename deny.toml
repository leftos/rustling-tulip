[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # interprocess (the daemon↔tracer transport) pulls in doctest-file and
    # recvmsg under the BSD Zero Clause License — public-domain-equivalent,
    # OSI-approved, strictly more permissive than the MIT/BSD entries above.
    "0BSD",
    # webpki-roots (via reqwest's rustls-tls) ships the Mozilla CA bundle under
    # the Community Data License Agreement — Permissive 2.0.
    "CDLA-Permissive-2.0",
    # libfuzzer-sys (via gpui → image → ravif → rav1e, the native client's image
    # stack) bundles LLVM's libFuzzer under the University of Illinois/NCSA
    # licence — permissive, OSI-approved, BSD-3-style attribution only.
    "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path deps (protocol, tracer-protocol) have no version
# requirement and so read as wildcards; that's expected for a workspace.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/leftos/gate",
    # These arrive with the pinned gpui (zed d2a4fb6) and go when it moves back to a crates.io release.
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/zed-industries/async-task",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs",
    "https://github.com/zed-industries/zed",
]
