[graph]
all-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Only flag unmaintained crates we directly depend on. The gtk-rs, unic-*, and
# proc-macro-error advisories all come in transitively through tauri/wry, which
# we can't upgrade away from — flagging them is noise we can't action.
unmaintained = "workspace"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # webpki-roots (via reqwest's rustls-tls) ships the Mozilla CA bundle under
    # the Community Data License Agreement — Permissive 2.0.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path deps (protocol, tracer-protocol) have no version
# requirement and so read as wildcards; that's expected for a workspace.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
