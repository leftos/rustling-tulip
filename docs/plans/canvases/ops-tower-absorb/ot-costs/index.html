<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Costs mock</title>
<style>
@font-face { font-family: "Geist"; font-weight: 400; src: url("../../../../../apps/native/assets/fonts/Geist/Geist-Regular.ttf"); }
@font-face { font-family: "Geist"; font-weight: 500; src: url("../../../../../apps/native/assets/fonts/Geist/Geist-Medium.ttf"); }
@font-face { font-family: "Geist"; font-weight: 600; src: url("../../../../../apps/native/assets/fonts/Geist/Geist-SemiBold.ttf"); }
@font-face { font-family: "Geist"; font-weight: 700; src: url("../../../../../apps/native/assets/fonts/Geist/Geist-Bold.ttf"); }
@font-face { font-family: "JBM"; font-weight: 400; src: url("../../../../../apps/native/assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf"); }
@font-face { font-family: "JBM"; font-weight: 700; src: url("../../../../../apps/native/assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf"); }

/* Tokens: apps/native/src/palette.rs, as the approved Dashboard mock */
:root {
  --ground: #111013; --sunken: #0b0a0d; --surface: #161519; --raised: #1b1a1f; --chip: #232129; --hover: #2c2a33;
  --line: #2a2830; --line-strong: #3a3742;
  --text: #ede9e4; --text-2: #a7a2ad; --subtle: #8c8794; --faint: #6e6a77;
  --accent: #f07a62; --on-accent: #1c100d;
  --working: #6ca6ff; --asking: #f6bc4e; --on-asking: #2a1b00; --waiting: #4fc89d; --danger: #f26d6d;
  --lilac: #c9b8ff; --ochre: #d9a15c; --rose: #e7849b; --peri: #8fb3f0;
  --ask-wash: rgba(246, 188, 78, 0.07); --danger-wash: rgba(242, 109, 109, 0.10);
  --mono: "JBM", ui-monospace, monospace;
  --claude: #8fb3f0; --deepseek: #d9a15c;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #08070a; color: var(--text); font-family: "Geist", system-ui, sans-serif; font-size: 13px; }
button { font: inherit; color: inherit; }

/* Lane and state switchers, outside the app frame */
.lanes, .states { display: flex; gap: 6px; align-items: stretch; padding: 10px 16px 0; width: 1600px; margin: 0 auto; box-sizing: content-box; }
.states { padding: 6px 16px 10px; align-items: center; }
.lanes .ttl, .states .ttl { font-weight: 600; color: var(--text-2); align-self: center; margin-right: 8px; white-space: nowrap; width: 92px; }
.lane-tab { flex: 1; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
.lane-tab b { display: block; font-weight: 600; }
.lane-tab span { color: var(--subtle); font-size: 12px; display: block; }
.lane-tab span.worst { color: var(--faint); margin-top: 2px; }
.lane-tab.on { border-color: var(--accent); background: var(--raised); }
.rec { display: inline-block !important; margin-left: 6px; font-size: 10.5px !important; font-weight: 600; color: var(--on-accent) !important; background: var(--accent); padding: 1px 6px; border-radius: 3px; vertical-align: 1px; }
.rec[hidden] { display: none !important; }
.st-tab { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px; color: var(--text-2); }
.st-tab.on { border-color: var(--accent); color: var(--text); background: var(--raised); }
.states .hint { color: var(--faint); font-size: 12px; margin-left: 10px; }

/* App frame */
.app { width: 1600px; height: 1000px; margin: 0 auto 24px; display: grid; grid-template-columns: 48px 1fr; grid-template-rows: 1fr 24px; background: var(--ground); border: 1px solid var(--line); overflow: hidden; }
.rail { background: var(--sunken); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 6px; }
.rail .ic { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; color: var(--text-2); position: relative; }
.rail .ic.on { background: var(--chip); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.rail .ic .n { position: absolute; top: 2px; right: 2px; font-size: 9px; background: var(--chip); color: var(--text-2); border-radius: 6px; padding: 0 3px; }
.rail .ic .n.ask { background: var(--asking); color: var(--on-asking); font-weight: 700; }
.rail .sp { flex: 1; }
.rail svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.main { display: grid; grid-template-rows: 38px 1fr; min-width: 0; min-height: 0; }
.tabbar { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: stretch; }
.tabbar .t { display: flex; align-items: center; gap: 7px; padding: 0 14px; border-right: 1px solid var(--line); color: var(--text-2); font-weight: 500; cursor: pointer; }
.tabbar .t.on { color: var(--text); background: var(--ground); box-shadow: inset 0 2px 0 var(--accent); }
.tabbar .t .x { color: var(--faint); margin-left: 6px; }
.tabbar .t .cnt { font-size: 11px; color: var(--working); }
.tabbar .t .badge { font-size: 10.5px; font-weight: 700; background: var(--asking); color: var(--on-asking); border-radius: 3px; padding: 0 5px; }
.tabbar .t svg { stroke: currentColor; fill: none; stroke-width: 1.7; }
.tabbar .plus { padding: 0 14px; display: flex; align-items: center; color: var(--subtle); font-size: 16px; }
.footer { grid-column: 1 / -1; background: var(--sunken); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 10px; font-size: 11.5px; color: var(--text-2); }
.footer .pill { border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 8px; line-height: 17px; }
.footer .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3fb96a; margin-right: 5px; }
.footer .sp { flex: 1; }
.content { overflow: hidden; min-height: 0; position: relative; }
.view { height: 100%; overflow: auto; }

/* Status glyphs, as the sidebar draws them */
.g { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; position: relative; vertical-align: -1px; }
.g.working { border: 2px solid var(--working); }
.g.working::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--working); }
.g.asking { border-radius: 3px; background: var(--asking); }
.g.asking::after { content: "!"; position: absolute; inset: 0; color: var(--on-asking); font-size: 9.5px; font-weight: 700; text-align: center; line-height: 12px; }
.g.waiting { border: 2px solid var(--waiting); }
.g.idle { width: 8px; height: 8px; margin: 2px; background: var(--faint); }
.g.stopped { border-radius: 2px; width: 10px; height: 10px; margin: 1px; border: 2px solid var(--faint); }
.g.done { width: 12px; height: 12px; }
.g.done::after { content: "✓"; position: absolute; inset: 0; color: var(--waiting); font-size: 11px; font-weight: 700; line-height: 12px; text-align: center; }
.g.dispatch { border-radius: 2px; width: 11px; height: 11px; border: 2px solid var(--deepseek); transform: rotate(45deg) scale(.8); }

/* Shared bits */
.mono { font-family: var(--mono); font-size: 11.5px; }
.sub { color: var(--subtle); }
.t2 { color: var(--text-2); }
.cut { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.repo { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); white-space: nowrap; }
.repo i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; flex: none; }
.c-ask { color: var(--asking); } .c-work { color: var(--working); } .c-wait { color: var(--waiting); } .c-dan { color: var(--danger); } .c-faint { color: var(--faint); }
.iss { font-family: var(--mono); font-size: 11.5px; color: var(--text); font-weight: 700; white-space: nowrap; }
.h { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--subtle); }
.btn { background: var(--chip); border: 1px solid var(--line-strong); border-radius: 5px; padding: 3px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.btn.ghost { background: transparent; }
.seg { display: inline-flex; background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 2px; }
.seg span { white-space: nowrap; padding: 2px 9px; border-radius: 3px; font-size: 12px; color: var(--text-2); }
.seg span.on { background: var(--chip); color: var(--text); font-weight: 500; }
.hsp { flex: 1; }
.num { font-variant-numeric: tabular-nums; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
.sw.cl { background: var(--claude); } .sw.ds { background: var(--deepseek); }
.link { color: var(--peri); cursor: pointer; white-space: nowrap; }

/* Dashboard header strip (as approved) */
.hdr { display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px; border-bottom: 1px solid var(--line); background: var(--surface); position: relative; }
.hdr h1 { font-size: 15px; font-weight: 600; margin: 0; }
.counts { display: flex; gap: 4px; }
.cpill { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 5px; background: var(--chip); font-size: 12px; color: var(--text-2); }
.cpill b { color: var(--text); font-weight: 600; }
.cpill.ask { background: rgba(246,188,78,.14); color: var(--asking); } .cpill.ask b { color: var(--asking); }
.figs { white-space: nowrap; display: flex; gap: 12px; font-size: 12px; color: var(--text-2); align-items: center; }
.figs b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.figs .sep { width: 1px; height: 16px; background: var(--line-strong); }
.money { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--raised); white-space: nowrap; }
.money.focus { border-color: var(--peri); box-shadow: 0 0 0 3px rgba(143,179,240,.15); }
.money.warn { border-color: rgba(246,188,78,.55); }
.money.err { border-color: rgba(242,109,109,.55); }
.money .lab { color: var(--subtle); }
.money .chev { color: var(--peri); margin-left: 2px; }
.rels { display: flex; gap: 10px; font-size: 11.5px; color: var(--text-2); }
.rel { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.rel .rb { width: 44px; height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
.rel .rb i { display: block; height: 100%; background: var(--lilac); }
.lnsync { white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--subtle); }
.lnsync i { width: 6px; height: 6px; border-radius: 50%; background: var(--lilac); display: inline-block; }
.flyout { position: absolute; top: 28px; left: 0; white-space: normal; z-index: 5; width: 330px; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 7px; box-shadow: 0 10px 28px rgba(0,0,0,.5); padding: 10px 12px; font-size: 12px; }
.flyout .fr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
.flyout .fr .v { text-align: right; font-variant-numeric: tabular-nums; }
.flyout .note { color: var(--faint); font-size: 11px; margin-top: 8px; line-height: 1.4; }

/* Dashboard rows, abbreviated: the approved lane A's grid, cost column only in focus */
.dash { padding-bottom: 16px; }
.dash .cols, .dash .row { display: grid; grid-template-columns: 30px 260px 160px minmax(0,1fr) 110px 96px; column-gap: 12px; align-items: center; padding: 0 18px 0 14px; }
.dash .cols { height: 26px; border-bottom: 1px solid var(--line); }
.dash .cols div { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--subtle); }
.dash .grp { display: flex; align-items: center; gap: 8px; padding: 12px 18px 5px 14px; }
.dash .grp .h { color: var(--text-2); } .dash .grp.ask .h { color: var(--asking); }
.dash .row { min-height: 42px; border-top: 1px solid var(--line); }
.dash .row.askrow { background: var(--ask-wash); box-shadow: inset 2px 0 0 var(--asking); }
.dash .two { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dash .r { text-align: right; justify-self: end; }
.dash .note { margin: 14px 18px; color: var(--faint); font-size: 12px; }

/* ---------- Costs tab ---------- */
.cv { padding: 0 0 22px; }
.chd { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
.chd h1 { font-size: 15px; font-weight: 600; margin: 0; }
.chd .meta { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); }
.chd .meta b { color: var(--text); font-weight: 500; }
.banner { display: flex; align-items: center; gap: 10px; margin: 12px 18px 0; padding: 7px 11px; border-radius: 6px; font-size: 12.5px; }
.banner.warn { background: var(--ask-wash); border: 1px solid rgba(246,188,78,.35); }
.banner.warn .k { color: var(--asking); font-weight: 600; }
.banner.err { background: var(--danger-wash); border: 1px solid rgba(242,109,109,.35); }
.banner.err .k { color: var(--danger); font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 12px 18px 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px 10px; min-width: 0; }
.tile .h { display: flex; justify-content: space-between; }
.tile .big { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 4px 0 6px; letter-spacing: -.01em; }
.tile .big .u { font-size: 12px; font-weight: 400; color: var(--subtle); margin-left: 6px; letter-spacing: 0; }
.tile .split { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.tile .split b { color: var(--text); font-weight: 500; }
.tile .bar { height: 5px; border-radius: 3px; background: var(--chip); overflow: hidden; margin-top: 8px; display: flex; }
.tile .bar i { display: block; height: 100%; }
.tile .foot { font-size: 11.5px; color: var(--subtle); margin-top: 6px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; min-width: 0; }
.box > .bh { display: flex; align-items: center; gap: 10px; padding: 9px 12px 6px; }
.box > .bh .r { margin-left: auto; font-size: 11.5px; color: var(--subtle); display: flex; gap: 12px; align-items: center; }
.chart { margin: 10px 18px 0; }
.chart svg { display: block; width: 100%; height: 150px; }
.grid2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 10px; margin: 10px 18px 0; }
.sess { margin: 10px 18px 0; }
table.tb { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12.5px; }
table.tb th { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--subtle); text-align: right; padding: 4px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.tb th.l, table.tb td.l { text-align: left; }
table.tb th.grp { text-align: center; color: var(--text-2); border-bottom: 0; padding-bottom: 0; }
table.tb td { padding: 5px 10px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.tb tr:last-child td { border-bottom: 0; }
table.tb .edge { border-left: 1px solid var(--line); }
table.tb tfoot td { border-top: 1px solid var(--line-strong); border-bottom: 0; font-weight: 600; }
table.tb tr.muted td { color: var(--text-2); }
table.tb tr.today td { background: rgba(143,179,240,.06); }
table.tb td .api { color: var(--faint); }
table.tb td.dash0 { color: var(--faint); }
table.tb .share { display: inline-block; width: 64px; height: 5px; background: var(--chip); border-radius: 3px; overflow: hidden; vertical-align: 1px; margin-left: 8px; }
table.tb .share i { display: block; height: 100%; float: left; }
.tag { font-size: 10.5px; color: var(--deepseek); border: 1px solid rgba(217,161,92,.4); border-radius: 3px; padding: 0 4px; margin-left: 6px; }
.empty { padding: 26px 18px; text-align: center; color: var(--subtle); font-size: 12.5px; line-height: 1.5; }
.empty b { color: var(--text); font-weight: 500; }
.chartempty { height: 150px; display: grid; place-items: center; color: var(--faint); font-size: 12.5px; border-top: 1px dashed var(--line); margin: 0 12px; }
.asof { color: var(--danger); font-size: 11px; margin-left: 6px; }
</style>
</head>
<body>

<div class="lanes" id="lanes">
  <div class="ttl">Costs · RT-464</div>
  <button class="lane-tab" data-lane="a"><b>A · Subscription share + Costs tab <span class="rec" id="rec-a" hidden>Recommended</span></b><span>Header total opens a Costs tab: tiles, 30-day bars, per repo, day and session. Claude is ops-tower's subscription share; DeepSeek is API spend.</span><span class="worst">Worst case: an account without a usage reading drops its share, and the share needs the accounts poller (G5) to exist.</span></button>
  <button class="lane-tab" data-lane="b"><b>B · API prices only + Costs tab <span class="rec" id="rec-b" hidden>Recommended</span></b><span>The same surfaces with each session's statusline cost: Claude at API prices, no subscription share, no accounts dependency.</span><span class="worst">Worst case: a month reads $1,222 on $600 of subscriptions; the figure says how hard you worked, not what you paid.</span></button>
  <button class="lane-tab" data-lane="c"><b>C · Header total only <span class="rec" id="rec-c" hidden>Recommended</span></b><span>Only the Dashboard's "Today" figure at API prices, with a hover breakdown. No Costs tab, no history.</span><span class="worst">Worst case: "what did yaat cost this month?" has no answer, and ops-tower's ledgers are dropped.</span></button>
</div>
<div class="states" id="states">
  <div class="ttl">State</div>
  <button class="st-tab" data-st="normal">Normal</button>
  <button class="st-tab" data-st="empty">First run</button>
  <button class="st-tab" data-st="partial">Partly counted</button>
  <button class="st-tab" data-st="error">Read failed</button>
  <span class="hint" id="tabhint"></span>
</div>

<div class="app" id="app">
  <nav class="rail">
    <div class="ic"><svg viewBox="0 0 20 20"><path d="M4 6h12M4 10h12M4 14h12"/></svg></div>
    <div class="ic on" title="Dashboard"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="4" rx="1"/><rect x="11" y="9" width="6" height="8" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/></svg><span class="n ask">2</span></div>
    <div class="ic"><svg viewBox="0 0 20 20"><path d="M3 11l2.5-6h9L17 11v5H3z"/><path d="M3 11h4l1 2h4l1-2h4"/></svg></div>
    <div class="ic"><svg viewBox="0 0 20 20"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="15" r="2"/><circle cx="14" cy="8" r="2"/><path d="M6 7v6M14 10c0 3-4 3-8 3"/></svg><span class="n">5</span></div>
    <div class="sp"></div>
    <div class="ic"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l3 2"/></svg></div>
    <div class="ic" style="margin-bottom:6px"><svg viewBox="0 0 20 20"><path d="M4 6h8M15 6h1M4 14h2M9 14h7"/><circle cx="13.5" cy="6" r="1.6"/><circle cx="7.5" cy="14" r="1.6"/></svg></div>
  </nav>
  <div class="main">
    <div class="tabbar" id="tabbar"></div>
    <div class="content"><section class="view" id="view"></section></div>
  </div>
  <div class="footer">
    <span class="pill">Connections</span>
    <span class="pill"><span class="dot"></span>daemon · 8 sessions · :4242</span>
    <span><span class="c-ask">◆</span> 2 need you</span>
    <span><span class="c-work">◉</span> 3 working</span>
    <span><span class="c-work">○</span> 1 background</span>
    <span><span class="c-wait">○</span> 1 waiting</span>
    <span class="sp"></span>
    <span id="foottab">Costs</span>
  </div>
</div>

<script>
const RECOMMENDED = 'a';
const REPOS = { 'rustling-tulip': '#f07a62', 'yaat': '#d9a15c', 'ops-tower': '#c9b8ff', 'skyline': '#8fb3f0', 'claude-config': '#e7849b' };

// Wed 28 Oct, 14:32. Three Claude Max subscriptions at $200 a month: $600, $19.35 a day in a 31-day month.
// share = API-equiv cost is never used to price the share; share comes from each account's 7-day window rises.
const SESS = [
  { g: 'asking', label: 'Settings modal height', repo: 'rustling-tulip', iss: 'RT-443', model: 'opus', run: '38m', tok: '426k', share: 0.70, api: 2.10, ds: 0 },
  { g: 'asking', label: 'Gate chips in light theme', repo: 'ops-tower', iss: 'OPS-352', model: 'opus', run: '26m', tok: '277k', share: 0.45, api: 1.40, ds: 0 },
  { g: 'working', label: 'Summary wire types', repo: 'rustling-tulip', iss: 'RT-444', model: 'opus', run: '1h 12m', tok: '1.28M', share: 2.30, api: 6.80, ds: 0 },
  { g: 'working', label: 'Ready-to-taxi call-up', repo: 'yaat', iss: 'YAAT-308', model: 'opus', run: '1h 31m', tok: '1.65M', share: 2.45, api: 7.90, ds: 0 },
  { g: 'working', label: 'Briefing login retry', repo: 'ops-tower', iss: 'OPS-347', model: 'opus', run: '2h 05m', tok: '2.08M', share: 2.70, api: 9.30, ds: 0 },
  { g: 'idle', label: 'METAR parser RMK groups', repo: 'yaat', iss: 'YAAT-312', model: 'sonnet', run: '3h 10m', tok: '912k', share: 0.95, api: 3.20, ds: 0 },

}
function sessTable() {
  const head = `<div class="bh"><span class="h">By session · today</span><span class="r">${isA() ? '<span>Claude share: the session\'s part of each hour\'s share, by its transcript usage</span>' : '<span>Claude: the session\'s statusline cost, subagents included</span>'}<div class="seg"><span class="on">Today</span><span>7 d</span><span>30 d</span></div></span></div>`;
  if (st === 'empty') return `<div class="box sess">${head}<div class="empty">No sessions have cost anything yet today.</div></div>`;
  const sorted = [...SESS].sort((a, b) => (b[claudeKey()] + b.ds) - (a[claudeKey()] + a.ds));
  const noCost = (s) => st === 'partial' && !isA() && (s.iss === 'RT-443' || s.iss === 'OPS-352');
  const body = sorted.map((s) => {
    const cl = s[claudeKey()];
    const clCell = s.kind ? '<td class="dash0">—</td>' : noCost(s) ? '<td class="c-ask">not yet</td>' : `<td>${usd(cl)}</td>`;
    const apiCell = isA() ? (s.kind ? '<td class="dash0">—</td>' : `<td><span class="api">${usd(s.api)}</span></td>`) : '';
    const tag = s.kind === 'dispatch' ? '<span class="tag">dispatch</span>' : s.kind === 'briefing' ? '<span class="tag">briefing</span>' : '';
    const total = (noCost(s) ? 0 : cl) + s.ds;
    return `<tr><td class="l" style="padding-right:0">${glyph(s.g)}</td><td class="l"><span style="font-weight:500">${esc(s.label)}</span>${tag}</td><td class="l">${repo(s.repo)}</td><td class="l"><span class="iss">${s.iss || ''}</span></td>
      <td class="l t2">${s.model}</td><td>${s.run}</td><td class="t2">${s.tok}</td>${clCell}${apiCell}<td class="${s.ds ? '' : 'dash0'}">${s.ds ? usd(s.ds) : '—'}</td><td><b style="font-weight:500">${noCost(s) ? '<span class="c-ask">—</span>' : usd(total)}</b></td></tr>`;
  }).join('');
  const cols = isA()
    ? '<col style="width:30px"><col style="width:270px"><col style="width:150px"><col style="width:96px"><col style="width:110px"><col><col><col><col><col><col>'
    : '<col style="width:30px"><col style="width:270px"><col style="width:150px"><col style="width:96px"><col style="width:110px"><col><col><col><col><col>';
  const th = `<tr><th></th><th class="l">Session</th><th class="l">Repository</th><th class="l">Issue</th><th class="l">Model</th><th>Run</th><th>Tokens</th><th>${isA() ? 'Claude share' : 'Claude'}</th>${isA() ? '<th>API prices</th>' : ''}<th>DeepSeek</th><th>Total</th></tr>`;
  return `<div class="box sess">${head}<table class="tb"><colgroup>${cols}</colgroup><thead>${th}</thead><tbody>${body}</tbody></table></div>`;
}
function costsView() {
  return `<div class="cv">${costsHeader()}${banner()}${tiles()}${chart()}<div class="grid2">${repoTable()}${dayTable()}</div>${sessTable()}</div>`;
}

/* ---------- Wiring ---------- */
function render() {
  if (lane === 'c' && tab === 'costs') tab = 'dash';
  document.getElementById('tabbar').innerHTML = tabbar();
  document.getElementById('view').innerHTML = tab === 'costs' ? costsView() : dashView();
  document.getElementById('foottab').textContent = tab === 'costs' ? 'Costs' : 'Dashboard';
  for (const t of document.querySelectorAll('.lane-tab')) t.classList.toggle('on', t.dataset.lane === lane);
  for (const t of document.querySelectorAll('.st-tab')) t.classList.toggle('on', t.dataset.st === st);
  document.getElementById('tabhint').textContent = lane === 'c' ? 'Lane C has no Costs tab: the Dashboard header and its hover breakdown are the whole feature.' : 'Click the Dashboard and Costs tabs in the app to switch between the header figure and the Costs view.';
  history.replaceState(null, '', `#${lane}-${st}-${tab}`);
}
document.getElementById('rec-' + RECOMMENDED).hidden = false;
document.getElementById('lanes').addEventListener('click', (e) => { const t = e.target.closest('.lane-tab'); if (t) { lane = t.dataset.lane; tab = lane === 'c' ? 'dash' : 'costs'; render(); } });
document.getElementById('states').addEventListener('click', (e) => { const t = e.target.closest('.st-tab'); if (t) { st = t.dataset.st; render(); } });
document.getElementById('tabbar').addEventListener('click', (e) => { const t = e.target.closest('[data-tab]'); if (t) { tab = t.dataset.tab; render(); } });
const m = (location.hash || '').slice(1).split('-');
if (m[0] && 'abc'.includes(m[0])) lane = m[0];
if (m[1]) st = m[1];
if (m[2]) tab = m[2];
render();
</script>
</body>
