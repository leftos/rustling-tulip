<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard mock</title>
<style>
@font-face { font-family: "Geist"; font-weight: 400; src: url("../../../../apps/native/assets/fonts/Geist/Geist-Regular.ttf"); }
@font-face { font-family: "Geist"; font-weight: 500; src: url("../../../../apps/native/assets/fonts/Geist/Geist-Medium.ttf"); }
@font-face { font-family: "Geist"; font-weight: 600; src: url("../../../../apps/native/assets/fonts/Geist/Geist-SemiBold.ttf"); }
@font-face { font-family: "Geist"; font-weight: 700; src: url("../../../../apps/native/assets/fonts/Geist/Geist-Bold.ttf"); }
@font-face { font-family: "JBM"; font-weight: 400; src: url("../../../../apps/native/assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf"); }
@font-face { font-family: "JBM"; font-weight: 700; src: url("../../../../apps/native/assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf"); }

/* Tokens: apps/native/src/palette.rs */
:root {
  --ground: #111013; --sunken: #0b0a0d; --surface: #161519; --raised: #1b1a1f; --chip: #232129; --hover: #2c2a33;
  --line: #2a2830; --line-strong: #3a3742;
  --text: #ede9e4; --text-2: #a7a2ad; --subtle: #8c8794; --faint: #6e6a77;
  --accent: #f07a62; --on-accent: #1c100d;
  --working: #6ca6ff; --asking: #f6bc4e; --on-asking: #2a1b00; --waiting: #4fc89d; --danger: #f26d6d;
  --lilac: #c9b8ff; --ochre: #d9a15c; --rose: #e7849b; --peri: #8fb3f0;
  --ask-wash: rgba(246, 188, 78, 0.07); --danger-wash: rgba(242, 109, 109, 0.10);
  --mono: "JBM", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #08070a; color: var(--text); font-family: "Geist", system-ui, sans-serif; font-size: 13px; }
button { font: inherit; color: inherit; }

/* Lane switcher, outside the app frame */
.lanes { display: flex; gap: 6px; align-items: stretch; padding: 10px 16px; width: 1600px; margin: 0 auto; }
.lanes .ttl { font-weight: 600; color: var(--text-2); align-self: center; margin-right: 8px; white-space: nowrap; }
.lane-tab { flex: 1; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
.lane-tab b { display: block; font-weight: 600; }
.lane-tab span { color: var(--subtle); font-size: 12px; }
.lane-tab.on { border-color: var(--accent); background: var(--raised); }
.rec { display: inline-block; margin-left: 6px; font-size: 10.5px; font-weight: 600; color: var(--on-accent); background: var(--accent); padding: 1px 6px; border-radius: 3px; vertical-align: 1px; }

/* App frame */
.app { width: 1600px; height: 1000px; margin: 0 auto 24px; display: grid; grid-template-columns: 48px 1fr; grid-template-rows: 1fr 24px; background: var(--ground); border: 1px solid var(--line); overflow: hidden; }
.rail { background: var(--sunken); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding-top: 6px; gap: 6px; }
.rail .ic { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; color: var(--text-2); position: relative; }
.rail .ic.on { background: var(--chip); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.rail .ic .n { position: absolute; top: 2px; right: 2px; font-size: 9px; background: var(--chip); color: var(--text-2); border-radius: 6px; padding: 0 3px; }
.rail .ic .n.ask { background: var(--asking); color: var(--on-asking); font-weight: 700; }
.rail .sp { flex: 1; }
.rail svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.main { display: grid; grid-template-rows: 38px 1fr; min-width: 0; min-height: 0; }
.tabbar { background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: stretch; }
.tabbar .t { display: flex; align-items: center; gap: 7px; padding: 0 14px; border-right: 1px solid var(--line); color: var(--text-2); font-weight: 500; }
.tabbar .t.on { color: var(--text); background: var(--ground); box-shadow: inset 0 2px 0 var(--accent); }
.tabbar .t .x { color: var(--faint); margin-left: 6px; }
.tabbar .t .cnt { font-size: 11px; color: var(--working); }
.tabbar .t .badge { font-size: 10.5px; font-weight: 700; background: var(--asking); color: var(--on-asking); border-radius: 3px; padding: 0 5px; }
.tabbar .plus { padding: 0 14px; display: flex; align-items: center; color: var(--subtle); font-size: 16px; }
.footer { grid-column: 1 / -1; background: var(--sunken); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 10px; font-size: 11.5px; color: var(--text-2); }
.footer .pill { border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 8px; line-height: 17px; }
.footer .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #3fb96a; margin-right: 5px; }
.footer .sp { flex: 1; }
.content { overflow: hidden; min-height: 0; position: relative; }
.view { display: none; height: 100%; overflow: auto; }
.view.on { display: block; }

/* Status glyphs, as the sidebar draws them */
.g { display: inline-block; flex: none; width: 12px; height: 12px; border-radius: 50%; position: relative; vertical-align: -1px; }
.g.working { border: 2px solid var(--working); }
.g.working::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: var(--working); }
.g.asking { border-radius: 3px; background: var(--asking); }
.g.asking::after { content: "!"; position: absolute; inset: 0; color: var(--on-asking); font-size: 9.5px; font-weight: 700; text-align: center; line-height: 12px; }
.g.waiting { border: 2px solid var(--waiting); }
.g.idle { width: 8px; height: 8px; margin: 2px; background: var(--faint); }
.g.stopped { border-radius: 2px; width: 10px; height: 10px; margin: 1px; border: 2px solid var(--faint); }
.g.done { width: 12px; height: 12px; }
.g.done::after { content: "✓"; position: absolute; inset: 0; color: var(--waiting); font-size: 11px; font-weight: 700; line-height: 12px; text-align: center; }
.g.queued { border: 2px dashed var(--faint); }
.g.gate { border-radius: 2px; border: 2px solid var(--working); width: 11px; height: 11px; }
.g.gate::after { content: ""; position: absolute; left: 2px; right: 2px; top: 2.5px; height: 2px; background: var(--working); }
.g.sm { transform: scale(0.85); }

/* Shared bits */
.mono { font-family: var(--mono); font-size: 11.5px; }
.sub { color: var(--subtle); }
.t2 { color: var(--text-2); }
.cut { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.repo { display: inline-flex; align-items: center; gap: 5px; color: var(--text-2); white-space: nowrap; flex: none; }
.il { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
.repo i { width: 7px; height: 7px; border-radius: 2px; display: inline-block; }
.c-ask { color: var(--asking); } .c-work { color: var(--working); } .c-wait { color: var(--waiting); } .c-dan { color: var(--danger); } .c-faint { color: var(--faint); }
.iss { font-family: var(--mono); font-size: 11.5px; color: var(--text); font-weight: 700; white-space: nowrap; flex: none; }
.lst { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-2); white-space: nowrap; flex: none; }
.lst .si { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid; display: inline-block; position: relative; }
.lst .si.prog { border-color: var(--peri); background: conic-gradient(var(--peri) 0 50%, transparent 0); }
.lst .si.rev { border-color: var(--waiting); background: conic-gradient(var(--waiting) 0 75%, transparent 0); }
.lst .si.done { border-color: var(--lilac); background: var(--lilac); }
.lst .si.todo { border-color: var(--faint); }
.prio { display: inline-flex; align-items: flex-end; gap: 1px; height: 10px; vertical-align: -1px; }
.prio i { width: 2.5px; background: var(--faint); display: block; border-radius: 1px; }
.prio i.on { background: var(--text-2); }
.prio.urgent { width: 11px; height: 11px; background: var(--danger); border-radius: 2px; color: #1a0606; font-size: 9px; font-weight: 700; justify-content: center; align-items: center; }
.ctx { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-2); }
.ctx .bar { width: 38px; height: 5px; background: var(--chip); border-radius: 3px; overflow: hidden; }
.ctx .bar i { display: block; height: 100%; background: var(--text-2); }
.ctx.hot .bar i { background: var(--danger); } .ctx.hot { color: var(--danger); }
.spark { display: inline-flex; align-items: flex-end; gap: 1.5px; height: 18px; }
.spark i { width: 5px; background: var(--working); opacity: .75; border-radius: 1px 1px 0 0; }
.spark.quiet i { background: var(--faint); }
.stuck { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--danger); background: var(--danger-wash); border: 1px solid rgba(242,109,109,.35); border-radius: 3px; padding: 0 5px; line-height: 16px; white-space: nowrap; }
.btn { background: var(--chip); border: 1px solid var(--line-strong); border-radius: 5px; padding: 3px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.btn.pri { background: var(--asking); color: var(--on-asking); border-color: var(--asking); font-weight: 600; }
.btn.ghost { background: transparent; }
.btn .k { font-family: var(--mono); font-size: 10.5px; color: var(--subtle); margin-right: 5px; }
.btn.pri .k { color: rgba(42,27,0,.7); }
.win { display: inline-block; width: 46px; flex: none; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.add { color: var(--waiting); } .del { color: var(--danger); }
.fst { font-family: var(--mono); font-size: 10.5px; width: 12px; display: inline-block; font-weight: 700; }
.fst.M { color: var(--ochre); } .fst.A { color: var(--waiting); } .fst.D { color: #e58a8a; }
.sha { font-family: var(--mono); font-size: 11px; color: var(--peri); }
.h { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--subtle); }
.lnsync { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--subtle); }
.lnsync i { width: 6px; height: 6px; border-radius: 50%; background: var(--lilac); display: inline-block; }

/* Header strip, shared by every lane */
.hdr { display: flex; align-items: center; gap: 14px; padding: 10px 18px 10px; border-bottom: 1px solid var(--line); background: var(--surface); }
.hdr h1 { font-size: 15px; font-weight: 600; margin: 0; }
.counts { display: flex; gap: 4px; }
.cpill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 5px; background: var(--chip); font-size: 12px; color: var(--text-2); }
.cpill b { color: var(--text); font-weight: 600; }
.cpill.ask { background: rgba(246,188,78,.14); color: var(--asking); } .cpill.ask b { color: var(--asking); }
.figs { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); }
.figs b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.figs .sep { width: 1px; background: var(--line-strong); }
.seg { display: inline-flex; background: var(--raised); border: 1px solid var(--line); border-radius: 5px; padding: 2px; }
.seg span { padding: 2px 9px; border-radius: 3px; font-size: 12px; color: var(--text-2); }
.seg span.on { background: var(--chip); color: var(--text); font-weight: 500; }
.hsp { flex: 1; }
.queue { display: flex; align-items: center; gap: 8px; padding: 7px 18px; border-bottom: 1px solid var(--line); background: var(--ask-wash); }
.qchip { display: inline-flex; align-items: center; gap: 7px; max-width: 560px; background: var(--raised); border: 1px solid rgba(246,188,78,.35); border-radius: 5px; padding: 3px 9px 3px 7px; font-size: 12px; }
.qchip .age { color: var(--asking); font-weight: 600; font-variant-numeric: tabular-nums; }
.rels { display: flex; gap: 10px; font-size: 11.5px; color: var(--text-2); }
.rel { display: inline-flex; align-items: center; gap: 5px; }
.rel .rb { width: 44px; height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
.rel .rb i { display: block; height: 100%; background: var(--lilac); }

/* ---------- Lane A: dense rows ---------- */
.ta { padding: 0 0 20px; }
.ta .cols, .ta .row, .ta .subrow { display: grid; grid-template-columns: 30px 232px 248px minmax(0,1fr) minmax(0,1fr) 104px 74px 70px 72px 66px; column-gap: 12px; align-items: center; padding: 0 18px 0 14px; }
.ta .cols { position: sticky; top: 0; z-index: 2; background: var(--ground); border-bottom: 1px solid var(--line); height: 26px; }
.ta .cols div { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--subtle); }
.ta .num { text-align: right; justify-self: end; }
.ta .grp { display: flex; align-items: center; gap: 8px; padding: 12px 18px 5px 14px; }
.ta .grp .h { color: var(--text-2); }
.ta .grp .n { font-size: 11px; color: var(--subtle); }
.ta .grp.ask .h { color: var(--asking); }
.ta .row { min-height: 46px; border-top: 1px solid var(--line); cursor: pointer; padding-top: 5px; padding-bottom: 5px; }
.ta .row:hover { background: var(--surface); }
.ta .row.open { background: var(--raised); }
.ta .row.askrow { background: var(--ask-wash); box-shadow: inset 2px 0 0 var(--asking); }
.ta .row .two { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ta .row .l1 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ta .lbl { font-weight: 600; }
.ta .subrow { height: 23px; font-size: 12px; }
.ta .subrow .tn { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; padding-left: 12px; min-width: 0; color: var(--text-2); }
.ta .subrow .tn .br { color: var(--line-strong); font-family: var(--mono); width: 14px; flex: none; }
.ta .subrow .tn .br2 { margin-left: 18px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.cmd { display: inline-block; background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; margin: 0 0 7px; }
.ta .subrow .act { grid-column: 4 / 6; min-width: 0; }
.ta .subrow .age { grid-column: 9 / 10; justify-self: end; color: var(--subtle); font-size: 11.5px; }
.ta .subrow .stk { grid-column: 6 / 9; }
.ta .askb { display: flex; align-items: flex-start; gap: 14px; margin: 0 18px 0 56px; padding: 7px 10px 9px; border-left: 2px solid var(--asking); background: var(--ask-wash); }
.ta .askb .q { flex: 1; min-width: 0; }
.ta .askb .q .tx { color: var(--text); margin-bottom: 6px; }
.ta .askb .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.ta .askb .cmd { display: inline-block; background: var(--sunken); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; margin: 0 0 6px; }
.drawer { margin: 0 18px 4px 14px; border: 1px solid var(--line-strong); border-top: 0; background: var(--surface); display: grid; grid-template-columns: 1.15fr 1fr 0.9fr; }
.drawer > div { padding: 10px 14px 12px; border-right: 1px solid var(--line); min-width: 0; }
.drawer > div:last-child { border-right: 0; }
.drawer .h { margin-bottom: 7px; display: flex; align-items: center; gap: 8px; }
.tl { display: flex; flex-direction: column; gap: 4px; }
.tl .ln { display: flex; gap: 6px; font-size: 12.5px; line-height: 1.35; }
.tl .ln .tx { color: var(--text); }
.tl .ln.old .tx { color: var(--text-2); }
.wk { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
.wk .r { display: flex; gap: 7px; align-items: baseline; min-width: 0; }
.wk .r .cut { flex: 1; }
.wk .r .age { color: var(--faint); font-size: 11px; flex: none; }
.figgrid { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; }
.figgrid .k { color: var(--subtle); }
.figgrid .v { font-variant-numeric: tabular-nums; }

/* ---------- Lane B: cards ---------- */
.tb { padding: 4px 18px 24px; }
.tb .sec { display: flex; align-items: center; gap: 8px; margin: 12px 0 7px; }
.tb .sec .h { color: var(--text-2); }
.tb .sec.ask .h { color: var(--asking); }
.tb .grid { display: grid; gap: 10px; }
.tb .g2 { grid-template-columns: 1fr 1fr; }
.tb .g3 { grid-template-columns: 1fr 1fr 1fr; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.card.askc { border-color: rgba(246,188,78,.45); box-shadow: inset 3px 0 0 var(--asking); }
.card .top { display: flex; align-items: center; gap: 7px; min-width: 0; }
.card .top .lbl { font-weight: 600; font-size: 13.5px; }
.card .meta { display: flex; align-items: center; gap: 8px; font-size: 11.5px; min-width: 0; }
.card .linr { display: flex; align-items: center; gap: 7px; font-size: 12px; background: var(--raised); border-radius: 4px; padding: 4px 7px; min-width: 0; }
.card .now { font-size: 12px; display: flex; gap: 6px; align-items: center; min-width: 0; }
.card .ask { background: var(--ask-wash); border: 1px solid rgba(246,188,78,.3); border-radius: 5px; padding: 8px 9px; }
.card .ask .tx { margin-bottom: 7px; line-height: 1.35; }
.card .ask .opts { display: flex; gap: 6px; flex-wrap: wrap; }
.card .tree { font-size: 12px; display: flex; flex-direction: column; gap: 3px; }
.card .tree .n { display: flex; align-items: center; gap: 6px; min-width: 0; }
.card .tree .n .br { color: var(--line-strong); font-family: var(--mono); flex: none; }
.card .tree .n .age { margin-left: auto; color: var(--subtle); font-size: 11px; flex: none; padding-left: 6px; }
.card .split { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
.card .foot { display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--text-2); border-top: 1px solid var(--line); padding-top: 6px; margin-top: auto; }
.card .foot b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.card.mini { gap: 5px; }
.card .more { font-size: 11.5px; color: var(--subtle); }

/* ---------- Lane C: tree + detail ---------- */
.tc.view.on { display: flex; flex-direction: column; overflow: hidden; }
.tc .split { display: grid; grid-template-columns: 452px 1fr; flex: 1; min-height: 0; }
.tc .left { border-right: 1px solid var(--line); overflow: auto; background: var(--surface); padding-bottom: 16px; }
.tc .right { overflow: auto; min-width: 0; }
.tc .lsec { padding: 10px 14px 4px; display: flex; align-items: center; gap: 8px; }
.tc .lsec.ask .h { color: var(--asking); }
.tc .rh { display: flex; align-items: center; gap: 7px; padding: 9px 14px 4px; font-weight: 600; font-size: 12.5px; }
.tc .rh .n { color: var(--subtle); font-weight: 400; font-size: 11.5px; margin-left: auto; }
.node { display: grid; grid-template-columns: 16px 1fr auto; column-gap: 7px; align-items: center; padding: 4px 14px 4px 14px; cursor: pointer; min-width: 0; }
.node:hover { background: var(--hover); }
.node.sel { background: var(--chip); box-shadow: inset 2px 0 0 var(--accent); }
.node.askn { background: var(--ask-wash); }
.node.askn.sel { background: var(--chip); }
.node .nm { font-weight: 600; display: flex; gap: 6px; align-items: center; min-width: 0; }
.node .age { color: var(--subtle); font-size: 11px; font-variant-numeric: tabular-nums; }
.node .ln2 { grid-column: 2 / 4; font-size: 12px; color: var(--text-2); }
.node .ln3 { grid-column: 2 / 4; font-size: 11.5px; }
.cn { display: grid; grid-template-columns: 16px 1fr auto; column-gap: 7px; align-items: center; padding: 1px 14px 1px 30px; font-size: 12px; color: var(--text-2); min-width: 0; }
.cn .br { color: var(--line-strong); font-family: var(--mono); }
.cn .age { color: var(--subtle); font-size: 11px; }
.cn.l2 { padding-left: 46px; }
.det { padding: 14px 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.det .dh { display: flex; align-items: flex-start; gap: 10px; }
.det .dh .ttl { font-size: 17px; font-weight: 600; }
.det .dh .m { display: flex; gap: 10px; align-items: center; font-size: 12px; margin-top: 3px; }
.det .acts { margin-left: auto; display: flex; gap: 6px; }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 10px 12px; min-width: 0; }
.box .h { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.box .h .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
.det .linbox { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; }
.det .linbox .it { font-size: 14px; font-weight: 600; }
.det .cols2 { display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px; }
.det .stackc { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dtree .n { display: grid; grid-template-columns: auto 14px 1fr auto; column-gap: 7px; align-items: start; padding: 4px 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.dtree .n:first-child { border-top: 0; }
.dtree .n .br { color: var(--line-strong); font-family: var(--mono); white-space: pre; }
.dtree .n .g { margin-top: 2px; }
.dtree .n .w { min-width: 0; }
.dtree .n .w .a { font-weight: 600; }
.dtree .n .w .b { color: var(--text-2); font-size: 12px; }

  const live = (l) => l.filter((n) => n.g === 'working' || n.g === 'gate').length;
  const bits = [];
  if (subs.length) bits.push(`${subs.length} sub${live(subs) ? ` <span class="c-work">(${live(subs)} live)</span>` : ''}`);
  if (sh.length) bits.push(`${sh.length} bg`);
  return bits.join(' · ') || '<span class="c-faint">—</span>';
}

function header() {
  const n = (g) => by(g).length;
  const cost = S.reduce((a, s) => a + s.m.cost, 0);
  return `<div class="hdr">
    <h1>Dashboard</h1>
    <div class="counts">
      <span class="cpill ask">${glyph('asking')}<b>${n('needs')}</b> need you</span>
      <span class="cpill">${glyph('working')}<b>${n('working')}</b> working</span>
      <span class="cpill">${glyph('idle')}<b>${n('idle')}</b> idle</span>
      <span class="cpill">${glyph('done')}<b>${n('done')}</b> done</span>
    </div>
    <div class="hsp"></div>
    <div class="figs">
      <span>Today <b>${money(cost)}</b> <span class="sub">API-equiv</span></span>
      <span><b>8.6M</b> tokens</span>
      <span><b>14</b> commits</span>
      <span><b>5</b> issues Done</span>
      <span class="sep"></span>
      <span class="rels">
        <span class="rel">vNext <span class="rb"><i style="width:61%"></i></span>11/18</span>
        <span class="rel">ops 0.9 <span class="rb"><i style="width:67%"></i></span>6/9</span>
        <span class="rel">yaat v0.14 <span class="rb"><i style="width:43%"></i></span>3/7</span>
      </span>
      <span class="lnsync"><i></i>Linear · 1m ago</span>
    </div>
    <div class="seg"><span class="on">By status</span><span>By repo</span></div>
  </div>`;
}
function queue() {
  return `<div class="queue"><span class="h c-ask" style="color:var(--asking)">Queue</span>${by('needs').map((s) =>
    `<span class="qchip">${glyph('asking')}<span class="iss">${s.issue.id}</span><span class="cut">${esc(s.pending.trigger === 'permission' ? 'Bash: ' + s.pending.cmd : s.pending.text)}</span><span class="age">${s.age}</span></span>`).join('')}
    <span class="hsp"></span><span class="sub" style="font-size:11.5px">Oldest first · <span class="mono">Ctrl+J</span> jumps to the next</span></div>`;
}

/* ---------- Lane A ---------- */
function laneA() {
  let h = header() + queue() + `<div class="ta"><div class="cols"><div></div><div>Session</div><div>Linear</div><div>Now</div><div>Summary</div><div>Agents</div><div>Context</div><div>10 min</div><div class="num">Run · last</div><div class="num">Cost</div></div>`;
  for (const [g, name] of GROUPS) {
    const list = by(g);
    h += `<div class="grp ${g === 'needs' ? 'ask' : ''}"><span class="h">${name}</span><span class="n">${list.length}</span></div>`;
    for (const s of list) {
      const open = s.id === 's1';
      h += `<div class="row ${g === 'needs' ? 'askrow' : ''} ${open ? 'open' : ''}" data-row="${s.id}">
        <div>${glyph(s.glyph)}</div>
        <div class="two"><div class="l1"><span class="lbl cut">${esc(s.label)}</span></div><div class="l1" style="font-size:11.5px">${repo(s.repo)}<span class="mono sub cut">${s.branch}</span></div></div>
        <div class="two"><div class="l1">${issueLine(s.issue)}</div><div class="cut t2" style="font-size:11.5px">${esc(s.issue.title)}</div></div>
        <div class="two"><div class="l1"><b class="${stateColor(s)}" style="font-weight:600">${s.state}</b><span class="sub">· ${s.age}</span>${stuck(s)}</div><div class="cut t2" style="font-size:12px">${esc(s.now)}</div></div>
        <div class="two"><div class="cut">${esc(s.tl[0][1])}</div><div class="cut sub" style="font-size:11.5px"><span class="win" style="width:auto;margin-right:5px">${s.tl[1] ? s.tl[1][0] : ''}</span>${s.tl[1] ? esc(s.tl[1][1]) : ''}</div></div>
        <div style="font-size:12px" class="t2">${treeCounts(s)}</div>
        <div>${ctx(s.m.ctx)}</div>
        <div>${spark(s.m.act)}</div>
        <div class="num two" style="align-items:flex-end"><span>${s.m.run}</span><span class="sub" style="font-size:11.5px">${s.m.last} ago</span></div>
        <div class="num two" style="align-items:flex-end"><span>${money(s.m.cost)}</span><span class="sub" style="font-size:11.5px">${s.m.tin}</span></div>
      </div>`;
      if (s.pending) h += `<div class="askb"><div class="q">${askBody(s.pending)}</div></div>`;
      if (g === 'working' || open) {
        for (const n of flatTree(s.tree).filter((x) => x.depth > 0)) {
          h += `<div class="subrow"><div></div><div class="tn"><span class="br ${n.depth > 1 ? 'br2' : ''}">└</span>${glyph(n.g, 'sm')}<span class="cut" style="${n.k === 'sub' ? 'color:var(--text)' : ''}">${esc(n.name)}</span></div>
          <div class="act cut ${n.act.startsWith('Running') ? 'mono t2' : 't2'}" style="${n.act.startsWith('Running') ? '' : 'font-size:12px'}">${esc(n.act || n.task)}</div>
          <div class="stk">${n.stuck ? `<span class="stuck">⚑ ${n.stuck}</span>` : ''}</div><div class="age">${n.age}</div></div>`;
        }
      }
      if (open) h += drawerA(s);
    }
  }
  return h + '</div>';
}
function drawerA(s) {
  return `<div class="drawer">
    <div><div class="h">Running summary <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:400">· newest first · model, 3m ago</span></div>${timeline(s.tl)}
      <div class="h" style="margin-top:12px">Prompt</div><div class="mono t2 cut">/nextup RT-444 — land the summary wire types, then the daemon side</div></div>
    <div><div class="h">Recent work <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:400">· ${filesSum(s.work)}</span></div>${work(s.work)}</div>
    <div><div class="h">Linear <span class="lnsync" style="text-transform:none;letter-spacing:0;font-weight:400"><i></i>synced</span></div>
      <div style="margin-bottom:4px">${issueLine(s.issue)}</div><div style="margin-bottom:8px">${esc(s.issue.title)}</div>
      <div class="figgrid"><span class="k">Project</span><span>${s.issue.project}</span><span class="k">Release</span><span>${s.issue.release} · 11/18 done</span><span class="k">Worktree</span><span class="mono cut t2">${s.wt}</span><span class="k">Tokens</span><span class="v">${s.m.tin} in · ${s.m.tout} out</span><span class="k">Started</span><span class="v">13:20 · ${s.m.run}</span></div>
      <div style="margin-top:8px;display:flex;gap:6px"><button class="btn">Go to pane</button><button class="btn ghost">Open diff</button><button class="btn ghost">Open RT-444</button></div></div>
  </div>`;
}

/* ---------- Lane B ---------- */
function treeB(s, max = 9) {
  return `<div class="tree">${flatTree(s.tree).slice(0, max).map((n) => `<div class="n" style="padding-left:${n.depth * 14}px">${n.depth ? '<span class="br">└</span>' : ''}${glyph(n.g, 'sm')}
    <span class="cut ${n.depth ? 't2' : ''}"><span style="${n.k === 'sub' || !n.depth ? 'color:var(--text);font-weight:500' : ''}">${esc(n.name)}</span> <span class="sub">· ${esc(n.act || n.task)}</span></span>
    ${n.stuck ? `<span class="stuck">⚑ ${n.stuck}</span>` : ''}<span class="age">${n.age}</span></div>`).join('')}</div>`;
}
function cardFoot(s) {
  return `<div class="foot">${ctx(s.m.ctx)}${spark(s.m.act)}<span><b>${s.m.tin}</b> tok</span><span><b>${money(s.m.cost)}</b></span><span>run <b>${s.m.run}</b></span><span class="hsp"></span><span>last <b>${s.m.last}</b> ago</span></div>`;
}
function cardTop(s) {
  return `<div class="top">${glyph(s.glyph)}<span class="lbl cut">${esc(s.label)}</span><span class="hsp"></span>${stuck(s)}<b class="${stateColor(s)}" style="font-weight:600;font-size:12px;white-space:nowrap">${s.state} · ${s.age}</b></div>
    <div class="meta">${repo(s.repo)}<span class="mono sub cut">${s.branch}</span></div>
    <div class="linr">${issueLine(s.issue)}<span class="cut t2">${esc(s.issue.title)}</span><span class="hsp"></span><span class="sub" style="white-space:nowrap">${s.issue.release}</span></div>`;
}
function laneB() {
  let h = header() + `<div class="tb">`;
  h += `<div class="sec ask"><span class="h">Needs you</span><span class="sub">${by('needs').length} · oldest first</span></div><div class="grid g2">`;
  for (const s of by('needs')) {
    h += `<div class="card askc">${cardTop(s)}<div class="ask">${askBody(s.pending)}</div>
      <div class="split"><div><div class="h" style="margin-bottom:4px">Agents</div>${treeB(s)}</div><div><div class="h" style="margin-bottom:4px">Summary</div>${timeline(s.tl, 2)}</div></div>${cardFoot(s)}</div>`;
  }
  h += `</div><div class="sec"><span class="h">Working</span><span class="sub">${by('working').length}</span></div><div class="grid g3">`;
  for (const s of by('working')) {
    h += `<div class="card">${cardTop(s)}<div class="h" style="margin-bottom:-3px">Agents</div>${treeB(s)}
      <div class="h" style="margin-bottom:-3px">Summary</div>${timeline(s.tl, 3)}
      <div class="h" style="margin-bottom:-3px;display:flex;gap:6px">Recent work <span class="sub" style="text-transform:none;letter-spacing:0;font-weight:400">${filesSum(s.work)}</span></div>${work({ ...s.work, files: s.work.files.slice(0, 2), commits: s.work.commits.slice(0, 1) }, 3)}
      ${cardFoot(s)}</div>`;
  }
  h += `</div><div class="grid g3" style="grid-template-columns:1fr 2fr;margin-top:4px">`;
  h += `<div><div class="sec"><span class="h">Idle</span><span class="sub">${by('idle').length}</span></div>${by('idle').map(miniB).join('')}</div>`;
  h += `<div><div class="sec"><span class="h">Done</span><span class="sub">${by('done').length}</span></div><div class="grid g2">${by('done').map(miniB).join('')}</div></div></div>`;
  return h + '</div>';
}
function miniB(s) {
  return `<div class="card mini">${cardTop(s)}<div style="font-size:12.5px">${esc(s.headline)}</div>${work({ ...s.work, files: [] }, 3)}${cardFoot(s)}</div>`;
}

/* ---------- Lane C ---------- */
let selC = 's1';
function laneC() {
  const left = [];
  left.push(`<div class="lsec ask"><span class="h">Needs you</span><span class="sub" style="font-size:11px">${by('needs').length}</span></div>`);
  for (const s of by('needs')) left.push(nodeC(s, true));
  for (const r of Object.keys(REPOS)) {
    const list = S.filter((s) => s.repo === r && s.group !== 'needs');
    const live = S.filter((s) => s.repo === r && (s.group === 'working' || s.group === 'needs')).length;
    left.push(`<div class="rh"><i style="width:8px;height:8px;border-radius:2px;background:${REPOS[r]};display:inline-block"></i>${r}<span class="n">${live} live · ${S.filter((s) => s.repo === r).length} sessions</span></div>`);
    for (const s of list) left.push(nodeC(s, false));
  }
  return `${header()}<div class="split"><div class="left">${left.join('')}</div><div class="right"><div class="det" id="detC">${detailC(S.find((s) => s.id === selC))}</div></div></div>`;
}
function nodeC(s, isAsk) {
  let h = `<div class="node ${isAsk ? 'askn' : ''} ${s.id === selC ? 'sel' : ''}" data-sel="${s.id}">
    ${glyph(s.glyph)}<span class="nm"><span class="cut">${esc(s.label)}</span><span class="iss" style="font-weight:400;color:var(--text-2)">${s.issue.id}</span></span><span class="age ${stateColor(s)}">${s.state === 'Working' || s.state === 'In gate' ? '' : s.state + ' · '}${s.age}</span>
    <span class="ln2 cut">${isAsk ? `${repo(s.repo)} · ` : ''}${esc(s.pending ? (s.pending.cmd ? 'Bash: ' + s.pending.cmd : s.pending.text) : s.headline)}</span>
    ${s.stuck ? `<span class="ln3">${stuck(s)}</span>` : ''}
  </div>`;
  if (!isAsk && (s.group === 'working')) {
    for (const n of flatTree(s.tree).filter((x) => x.depth > 0)) {
      h += `<div class="cn ${n.depth > 1 ? 'l2' : ''}"><span class="br">└</span><span class="cut">${glyph(n.g, 'sm')} <span style="${n.k === 'sub' ? 'color:var(--text)' : ''}">${esc(n.name)}</span> <span class="sub">· ${esc(n.act.startsWith('Running') ? n.act.split(':')[0] : (n.act || n.task))}</span></span><span class="age">${n.age}</span></div>`;
    }
  }
  return h;
}
function ctxSvg(h) {
  const H = 56;
  const pts = h.map((v, i) => `${(i / (h.length - 1)) * 300},${H - (v / 100) * H}`).join(' ');
  return `<svg class="ctxspark" viewBox="0 0 300 ${H}" preserveAspectRatio="none"><polygon points="0,${H} ${pts} 300,${H}" fill="rgba(108,166,255,.14)"/><line x1="0" x2="300" y1="${H - 0.8 * H}" y2="${H - 0.8 * H}" stroke="#f26d6d" stroke-dasharray="3 3" stroke-width="1" opacity=".6" vector-effect="non-scaling-stroke"/><polyline points="${pts}" fill="none" stroke="#6ca6ff" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function actLane(s) {
  const segs = {
    s1: [[0, 18, 'w'], [18, 22, 'a'], [22, 60, 'w'], [60, 66, 'i'], [66, 100, 'w']],
    s2: [[38, 80, 'w'], [80, 84, 'a'], [84, 94, 'w'], [94, 100, 'a']],
    s3: [[70, 97, 'w'], [97, 100, 'a']],
    s4: [[0, 40, 'w'], [40, 55, 'i'], [55, 100, 'w']],
    s5: [[10, 30, 'w'], [30, 34, 'a'], [34, 100, 'w']],
    s6: [[0, 52, 'w'], [52, 100, 'i']],
    s7: [[20, 82, 'w'], [82, 100, 'd']],
    s8: [[50, 79, 'w']],
  };
  const col = { w: 'var(--working)', a: 'var(--asking)', i: 'var(--faint)', d: 'var(--waiting)' };
  const row = (id, name) => `<span class="cut t2">${name}</span><span class="trk">${segs[id].map(([a, b, k]) => `<i style="left:${a}%;width:${b - a}%;background:${col[k]};opacity:${id === s.id ? 1 : .55}"></i>`).join('')}</span>`;
  return `<div class="actlane">${S.map((x) => row(x.id, x.issue.id)).join('')}<span></span><span class="ax"><span>12:32</span><span>13:02</span><span>13:32</span><span>14:02</span><span>now</span></span></div>`;
}
function detailC(s) {
  const t = flatTree(s.tree);
  const tree = `<div class="dtree">${t.map((n) => `<div class="n"><span class="br">${n.depth ? '   '.repeat(n.depth - 1) + '└─' : ''}</span>${glyph(n.g)}<div class="w"><div class="a">${esc(n.name)} ${n.stuck ? `<span class="stuck">⚑ ${n.stuck}</span>` : ''}</div><div class="b">${esc(n.task)}</div>${n.act ? `<div class="c ${n.act.startsWith('Running') ? 'mono t2' : 'sub'}" style="font-size:${n.act.startsWith('Running') ? '11px' : '12px'}">${esc(n.act)}</div>` : ''}</div><div class="rt">${n.age}</div></div>`).join('')}</div>`;
  const ask = s.pending ? `<div class="box" style="border-color:rgba(246,188,78,.45);background:var(--ask-wash)"><div class="h" style="color:var(--asking)">${s.pending.trigger === 'permission' ? 'Permission' : 'Question'} · waiting ${s.age}</div>${askBody(s.pending).replace('class="tx"', 'class="tx" style="font-size:13.5px;margin-bottom:8px"')}</div>` : '';
  return `<div class="dh">${glyph(s.glyph)}<div style="min-width:0"><div class="ttl">${esc(s.label)}</div>
      <div class="m">${repo(s.repo)}<span class="mono sub">${s.branch}</span><span class="sub">·</span><b class="${stateColor(s)}">${s.state} · ${s.age}</b>${stuck(s)}</div></div>
      <div class="acts"><button class="btn">Go to pane</button><button class="btn ghost">Open diff</button><button class="btn ghost">Stop</button></div></div>
    ${ask}
    <div class="box linbox"><div style="display:flex;gap:8px;align-items:center">${issueLine(s.issue)}<span class="it">${esc(s.issue.title)}</span></div><span class="lnsync"><i></i>Linear · synced 1m ago</span>
      <div class="sub" style="font-size:12px">${s.issue.project} · release ${s.issue.release} · sub-issues 2/3 done · branch linked</div><span class="sub" style="font-size:12px">Open in Linear ↗</span></div>
    <div class="cols2">
      <div class="stackc">
        <div class="box"><div class="h">Agents <span class="r sub">${treeCounts(s)}</span></div>${tree}</div>
        <div class="box"><div class="h">Running summary <span class="r sub">newest first · model · 3m ago</span></div><div class="timeline2">${s.tl.map(([w, x], i) => `<span class="w">${w}</span><span class="${i ? 'old' : ''}">${esc(x)}</span>`).join('')}</div></div>
        <div class="box"><div class="h">Prompt <span class="r sub">first user message</span></div><div class="mono t2">${esc(s.tree[0].task)} — ${esc(s.issue.title)}</div></div>
      </div>
      <div class="stackc">
        <div class="box"><div class="h">Recent work <span class="r sub">${filesSum(s.work)}</span></div>${work(s.work)}</div>
        <div class="box"><div class="h">Figures</div>
          <div class="figgrid" style="grid-template-columns:auto 1fr auto 1fr"><span class="k">Context</span><span>${ctx(s.m.ctx)}</span><span class="k">Cost</span><span class="v">${money(s.m.cost)} <span class="sub">API-equiv</span></span>
            <span class="k">Tokens</span><span class="v">${s.m.tin} in · ${s.m.tout} out</span><span class="k">Runtime</span><span class="v">${s.m.run}</span>
            <span class="k">Last</span><span class="v">${s.m.last} ago</span><span class="k">10 min</span><span>${spark(s.m.act)}</span></div>
          ${s.m.ctxh ? `<div class="sub" style="font-size:11px;margin:8px 0 2px">Context, last 2 h <span style="float:right">80% line</span></div>${ctxSvg(s.m.ctxh)}` : ''}
        </div>
        <div class="box"><div class="h">Activity · every session, 2 h <span class="r sub"><span class="c-work">■</span> working <span class="c-ask">■</span> asking <span class="c-faint">■</span> idle <span class="c-wait">■</span> finished</span></div>${actLane(s)}</div>
      </div>
    </div>`;
}

/* ---------- Wiring ---------- */
function render() {
  document.getElementById('view-a').innerHTML = laneA();
  document.getElementById('view-b').innerHTML = laneB();
  document.getElementById('view-c').innerHTML = laneC();
}
function show(l) {
  for (const v of document.querySelectorAll('.view')) v.classList.toggle('on', v.id === 'view-' + l);
  for (const t of document.querySelectorAll('.lane-tab')) t.classList.toggle('on', t.dataset.lane === l);
  history.replaceState(null, '', '#' + l);
}
document.getElementById('rec-' + RECOMMENDED).hidden = false;
render();
document.getElementById('lanes').addEventListener('click', (e) => { const t = e.target.closest('.lane-tab'); if (t) show(t.dataset.lane); });
document.getElementById('view-c').addEventListener('click', (e) => {
  const n = e.target.closest('[data-sel]'); if (!n) return;
  selC = n.dataset.sel; document.getElementById('view-c').innerHTML = laneC();
});
document.getElementById('view-a').addEventListener('click', (e) => {
  const r = e.target.closest('.row'); if (!r || e.target.closest('button')) return;
  const next = r.nextElementSibling;
  if (next && next.classList.contains('drawer')) { next.remove(); r.classList.remove('open'); return; }
  let after = r; while (after.nextElementSibling && after.nextElementSibling.matches('.askb, .subrow')) after = after.nextElementSibling;
  if (after.nextElementSibling && after.nextElementSibling.classList.contains('drawer')) { after.nextElementSibling.remove(); r.classList.remove('open'); return; }
  const s = S.find((x) => x.id === r.dataset.row);
  after.insertAdjacentHTML('afterend', drawerA(s)); r.classList.add('open');
});
show((location.hash || '#a').slice(1) || 'a');
</script>
</body>
</html>
