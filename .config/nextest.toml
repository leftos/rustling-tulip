# cargo-nextest configuration (https://nexte.st/docs/configuration/).
# The cargo build profile is chosen on the command line
# (`--cargo-profile test-release`); `[profile.*]` here are nextest profiles.

[test-groups]
# The live e2e and OS smoke specs each own a real daemon, and the smoke specs
# a real client window: run them one at a time.
serial-live = { max-threads = 1 }

[profile.default]
fail-fast = false
retries = 0
# A hang guard, not a speed bound: a test still running after 5 periods
# (300 s, about 20x the slowest passing test) is killed and fails as TIMEOUT.
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = "binary_id(rustling-tulip-native::e2e_live) | binary_id(rustling-tulip-native::e2e_recover) | binary_id(rustling-tulip-native::e2e_remote) | binary_id(rustling-tulip-native::e2e_ssh) | binary_id(rustling-tulip-native::smoke_window)"
test-group = "serial-live"
# Their own waits run up to 300 s (a cold daemon start, the recover hang
# guard), so their guard sits above that: 6 periods of 120 s.
slow-timeout = { period = "120s", terminate-after = 6 }
