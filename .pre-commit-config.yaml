# Git hooks, run via prek (https://github.com/j178/prek).
#
#   prek install                  # one-time, installs the git shims
#   prek run                      # run the pre-commit stage against staged files
#   prek run --all-files          # run against the whole tree
#   prek run --hook-stage pre-push --all-files
#   prek auto-update --cooldown-days 7
#
# There is no CI in this repo yet, so these hooks are the only automated
# gates. Hygiene and fmt run at pre-commit, so a commit stays cheap; clippy
# (which compiles GPUI) runs at pre-push, so what reaches origin is
# warning-free. No hook runs the tests: they run by hand through
# `.\rt.ps1 test` (cargo-nextest, full suite), or `.\rt.ps1 test -Reached`
# for the tests one change reaches (tools/test-map.json).
#
# Anything needing the network (`cargo deny check` wants the advisory DB) is
# deliberately left out: a hook that fails on a plane is a hook that gets
# uninstalled. Run `cargo deny check` by hand before releases.

default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Sources and config only. Markdown is excluded because two trailing
      # spaces are a hard line break, and the plan docs rely on it.
      - id: trailing-whitespace
        types_or: [rust, javascript, json, yaml, toml]
      - id: end-of-file-fixer
        types_or: [rust, javascript, json, yaml, toml]
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd)$'
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      # `tailscale cert` writes a TLS private key for the daemon at runtime. It
      # lives in the machine-local data dir, not the repo, but the cost of being
      # wrong here is a leaked key in git history.
      - id: detect-private-key
      # Cargo.lock and the native client's bundled fonts are legitimately
      # large; nothing else should be.
      - id: check-added-large-files
        args: [--maxkb=512]
        exclude: '^(Cargo\.lock|apps/native/assets/fonts/.*\.ttf)$'

  - repo: local
    hooks:
      # Formatting is the one Rust check cheap enough for pre-commit.
      # `--check` rather than a rewrite: a hook that edits files under you
      # mid-commit is worse than one that tells you to run `cargo fmt`.
      - id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: check-agent-names
        name: agent names stay behind the seam
        entry: pwsh -NoProfile -File tools/check-agent-names.ps1
        language: system
        pass_filenames: false
        always_run: true

      - id: cargo-clippy
        name: cargo clippy (-D warnings)
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
