[package]
name = "rt-native-spike"
version = "0.0.0"
edition = "2024"
publish = false
description = "Spike: GPUI + alacritty_terminal client that attaches to a running rustling-tulip daemon session"

# Standalone workspace: keeps GPUI's build out of the main workspace's
# `cargo build`, clippy and cargo-deny runs.
[workspace]

[dependencies]
protocol = { path = "../../crates/protocol" }
gpui = "0.2.2"
alacritty_terminal = "0.26.0"
tokio = { version = "1", features = ["rt", "net", "macros"] }
tokio-tungstenite = "0.29.0"
futures = "0.3"
serde_json = "1.0"
base64 = "0.22"
directories = "5.0"
anyhow = "1.0"
