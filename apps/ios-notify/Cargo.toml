[package]
name = "rustling-tulip-ios-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rustling-tulip phone app's notification service extension: decrypts a relay push into its alert"
publish = false

[lib]
name = "rustling_tulip_ios_notify"
path = "src/lib.rs"

[[bin]]
name = "rustling-tulip-ios-notify"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
chrono = { workspace = true }
protocol = { workspace = true }
push-crypto = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDictionary",
    "NSObject",
    "NSString",
    "NSValue",
] }
# A Needs you alert first removes the delivered Needs you notifications its
# notice ends (`clearing::ends`), read and removed through the notification
# center.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationServiceExtension",
    "UNUserNotificationCenter",
] }
security-framework = { version = "3.7", default-features = false }
