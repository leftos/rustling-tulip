[package]
name = "rustling-tulip-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rustling-tulip phone app: the iPhone binary over the native client's phone shell"
publish = false

[[bin]]
name = "rustling-tulip-ios"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rustling-tulip-native = { path = "../native" }

gpui = { git = "https://github.com/leftos/zed", rev = "eb44e196488fb689487756bed11a811280c4a66d" }

[target.'cfg(target_os = "ios")'.dependencies]
gpui_ios = { git = "https://github.com/leftos/zed", rev = "eb44e196488fb689487756bed11a811280c4a66d" }
