[package]
name = "rustling-tulip-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "rustling-tulip Tauri desktop client"
license.workspace = true
publish = false

[lib]
name = "rustling_tulip_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { workspace = true }
uuid = { workspace = true }
anyhow = "1"
chrono = "0.4"
directories = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = [
    "fs",
    "process",
    "rt",
    "time",
    "macros",
    "net",
    "io-util",
] }
sha2 = "0.10"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Pinned-TLS loopback tunnel to a remote daemon (LAN access). Same `ring`
# backend as the daemon + reqwest, so no `aws-lc-sys` (NASM/CMake) in the tree.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
base64 = "0.22"
# Browse for LAN hosts the daemon advertises over mDNS (see remote.rs).
mdns-sd = { workspace = true }

[target.'cfg(windows)'.dependencies]
# HKCU Run-key access for the "start daemon on login" host setting.
winreg = "0.55"

[dev-dependencies]
# Generates a throwaway self-signed cert so the pinned verifier test can prove
# it accepts a matching fingerprint and rejects a different one.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
