[package]
name = "rustling-tulip-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rustling-tulip native client: GPUI + alacritty_terminal view of a daemon session"
publish = false

[lib]
name = "rustling_tulip_native"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "rustling-tulip-native"
path = "src/main.rs"

[lints]
workspace = true

[features]
# The headless client driver: a registry of every named element's painted
# bounds (src/driver/), fed at prepaint, and the endpoint a driven run opens:
# a named pipe (`interprocess`), current-user only (`Win32_Security`,
# `Win32_Security_Authorization`), and `screenshot`'s capture (`Win32_Storage_Xps`
# for PrintWindow) written as a PNG. Off by default.
driver = [
    "dep:interprocess",
    "windows/Win32_Security",
    "windows/Win32_Security_Authorization",
    "windows/Win32_Storage_Xps",
]

[dependencies]
# The driver gate requires each registered agent's binary override.
agent-registry = { workspace = true }
daemon-client = { workspace = true }
protocol = { workspace = true }
tailnet = { workspace = true }
update-core = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

gpui = { git = "https://github.com/leftos/zed", rev = "2640ed91240892bc212b050bb6eb194b42bc4d02" }
# gpui 0.2.2 turned these on by default; without `font-kit` macOS draws no text.
gpui_platform = { git = "https://github.com/leftos/zed", rev = "2640ed91240892bc212b050bb6eb194b42bc4d02", features = [
    "font-kit",
    "wayland",
    "x11",
] }
alacritty_terminal = "0.26.0"
# `rustls-tls-native-roots`: a tailnet host is dialled over TLS through
# `Connector::Rustls`, with the client config net.rs builds from the OS
# certificate store on the `ring` provider below.
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
# TLS for the tailnet dial, pinned to the `ring` provider as the daemon is: keeps
# `aws-lc-sys` (and its NASM/CMake build requirement) out of the tree.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
futures = "0.3"
base64 = "0.22"
unicode-segmentation = "1.13.2"
regex = "1.11"
similar = "3.2.0"
# The text viewer's UTF-16 decoding; a UTF-16 file is text only with a BOM.
encoding_rs = "0.8"
# The Markdown view's block model: the event parser only, no HTML renderer.
pulldown-cmark = { version = "0.13", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
qrcodegen = "1.8"
# The spawn dialog's Extra arguments split by POSIX shell words, the rule the
# daemon splits the launch command's extra arguments by.
shell-words = "1.1"
# Test support's SHA-256 (`tests/support/profile_server.rs`,
# `tests/e2e_recover.rs`) and the updater's release versions' order; the feed,
# download and verify steps themselves are `update-core`'s.
sha2 = "0.10"
semver = { workspace = true }
# A fetched folder arrives as a zstd-compressed tar stream, which the client
# unpacks itself (`src/folder_unpack.rs`).
tar = { workspace = true }
zstd = { workspace = true }
# The Needs you sound: playback through the OS output device, and the WAV and
# Ogg Vorbis decoders only (pure Rust); Ogg is why not Windows' `PlaySound`.
rodio = { version = "0.23.0", default-features = false, features = [
    "playback",
    "wav",
    "vorbis",
] }
interprocess = { version = "2", features = ["tokio"], optional = true }
# Pasting a copied bitmap into a remote session sends it as a PNG.
png = "0.18"

[target.'cfg(not(target_os = "ios"))'.dependencies]
# The desktop's roots, read out of the OS certificate store's files.
rustls-native-certs = "0.8"

[target.'cfg(target_os = "ios")'.dependencies]
# iOS has no certificate files to read: its roots come from Security.framework
# through the platform verifier, on the same `ring` provider as the desktop.
rustls-platform-verifier = "0.7.1"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# The app's own toasts reach their window through its native handle.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# The app's own toasts: the screen's visible frame (`NSScreen`), keeping a
# toast's panel up and off the keyboard (`NSPanel`) and moving it (`NSView`
# to its `NSWindow`) on the main queue once gpui's update returns
# (`dispatch2`), at the versions gpui already pulls in.
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "objc2"] }
# The start guard asks whether another client's run still goes (`kill(pid, 0)`).
libc = "0.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSArray",
    "NSGeometry",
] }

[target.'cfg(windows)'.dependencies]
# Toasts: their XML (`Data_Xml_Dom`), the popup's in-process press handler
# (`Foundation`), and the toast activator (`Win32_UI_Notifications`) with the
# Start-menu shortcut that carries the app id and its class id
# (`Win32_UI_Shell_PropertiesSystem`, `Win32_Storage_EnhancedStorage` for the
# property keys, `Win32_System_Com_StructuredStorage` and `Win32_System_Variant`
# for their values). The taskbar badge draws its icon through GDI
# (`Win32_Graphics_Gdi`) and sets it through `Win32_UI_Shell`'s taskbar list.
# A copied bitmap is read through the clipboard (`Win32_System_DataExchange`,
# `Win32_System_Memory`). The owner's idle time compares the last input's tick
# with the system's (`Win32_System_SystemInformation` for `GetTickCount`).
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Notifications",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
] }
# `#[implement]` (the toast activator's COM classes) expands to paths under
# `::windows_core`, so the crate `windows` already pulls in is named directly.
windows-core = "0.61"

[build-dependencies]
# Embeds the app icon (build.rs); the version gpui's own build script already uses.
embed-resource = "3.0.9"

[dev-dependencies]
# The agent options model's conformance check against `validate`, over the
# test agent's descriptor.
agent-api = { workspace = true, features = ["test-support"] }
# The fake daemon sends the daemon's own agent descriptors, and the live tier
# points every registered agent at its fake CLI.
agent-registry = { workspace = true, features = ["test-support"] }
# The live tier's isolated daemon, which `tests/support/live.rs` wraps.
dev-daemon = { workspace = true }
gpui = { git = "https://github.com/leftos/zed", rev = "2640ed91240892bc212b050bb6eb194b42bc4d02", features = ["test-support"] }
png = "0.18"
# `test-util` enables the paused clock net.rs's tests run its deadlines on.
tokio = { workspace = true, features = ["test-util"] }
# The fake TLS daemon in net.rs's tests: a test CA and a leaf signed by it.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
