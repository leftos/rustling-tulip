[package]
name = "rustling-tulip-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rustling-tulip native client: GPUI + alacritty_terminal view of a daemon session"
publish = false

[lib]
name = "rustling_tulip_native"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "rustling-tulip-native"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
daemon-client = { workspace = true }
protocol = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

gpui = "0.2.2"
alacritty_terminal = "0.26.0"
# `rustls-tls-native-roots`: a tailnet host is dialled over TLS through
# `Connector::Rustls`, with the client config net.rs builds from the OS
# certificate store on the `ring` provider below.
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
# TLS for the tailnet dial, pinned to the `ring` provider as the daemon is: keeps
# `aws-lc-sys` (and its NASM/CMake build requirement) out of the tree.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-native-certs = "0.8"
futures = "0.3"
base64 = "0.22"
unicode-segmentation = "1.13.2"
regex = "1.11"
similar = "3.2.0"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
tauri-winrt-notification = "0.7.3"
# The mock panel's WebView2 child window (mock_view.rs).
wry = "0.57.0"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "UI_Notifications",
] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
png = "0.18"
sha2 = "0.10"
# The fake TLS daemon in net.rs's tests: a test CA and a leaf signed by it.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
