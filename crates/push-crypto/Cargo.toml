[package]
name = "push-crypto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "RFC 8291 push message encryption and decryption, shared by the daemon and the phone app"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = "0.22"
# RFC 8291 payload encryption (P-256 ECDH, HKDF-SHA256, AES-128-GCM). `p256`
# rather than `ring` because the RFC 8291 test vector fixes the sender's
# ephemeral key, which `ring` cannot import. Pure Rust, so no `aws-lc-sys`.
aes-gcm = "0.11.1"
hkdf = "0.13.0"
p256 = { version = "0.14.0", default-features = false, features = [
    "ecdh",
    "ecdsa",
    "std",
] }
# The digest 0.11 generation `hkdf` 0.13 is built on.
sha2 = "0.11"
