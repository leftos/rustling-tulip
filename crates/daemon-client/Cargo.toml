[package]
name = "daemon-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Daemon supervision shared by rustling-tulip clients: locate, spawn, reuse and stop rustling-tulipd"
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
directories = { workspace = true }
protocol = { workspace = true }
# Orders the running daemon's build version against this client's
# (`supervisor::classify_proven`): an older daemon is retired, a newer one never.
semver = { workspace = true }
# The daemon proof (`src/proof.rs`): a listener named by `daemon.json` proves it
# holds the token before the client sends the token or kills its pid.
tracer-protocol = { workspace = true }
getrandom = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sha2 = "0.10"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
# Cross-platform credential-store API. `src/device_tokens.rs` files the device
# tokens remote hosts issue under Windows Credential Manager or the macOS login
# Keychain; the platform stores themselves are `windows-native-keyring-store`
# and `apple-native-keyring-store` below.
keyring-core = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS's login Keychain as the `keyring-core` store; the `keychain` feature is
# the legacy (login) keychain store.
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Windows Credential Manager as the `keyring-core` store. Default features off
# drops its regex-backed credential search: tokens are looked up by host only.
windows-native-keyring-store = { version = "1.1", default-features = false }
# `OpenProcess` / `TerminateProcess` / `WaitForSingleObject`: a daemon's pid is
# pinned by a process handle before its proof, and killed only through it.
# `CreateProcessW` (Threading): `src/spawn_detached.rs` starts the daemon and
# the daemon's tracers with no inherited handles.
# COM, OLE, RPC, Variant and WMI: `src/wmi_launch.rs` starts the daemon through
# `Win32_Process.Create` when the caller's job forbids breakaway.
# `Win32_Security`: `src/profile.rs` reads this process's token integrity level.
# `Win32_Security_Authorization` and `Win32_Storage_FileSystem`:
# `src/protected_root.rs` creates the protected root from its SDDL, opens and
# holds it, and reads its descriptor back.
# `Win32_System_RemoteDesktop`: `src/logon_task.rs` reads the caller's session
# and looks for the user's interactive session (`WTSEnumerateSessionsW`).
# `Win32_NetworkManagement_IpHelper`: `src/listener_owner.rs` reads which pid
# owns the daemon's listener (`GetExtendedTcpTable`) before a force-stop.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_RemoteDesktop",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
] }

[target.'cfg(windows)'.dev-dependencies]
# Job objects for the supervisor tests that prove a spawned daemon breaks away
# from its caller's job; `CreateJobObjectW` needs `Win32_Security`. `CreatePipe`
# (Pipes) and `ReadFile` (Storage_FileSystem, which compiles it only with
# System_IO, the feature of its OVERLAPPED parameter) for the test that proves
# a spawned daemon inherits no caller handle.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
