[package]
name = "tracer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rt-tracer.exe: per-session PTY supervisor that owns the session's child process and survives daemon restarts."
publish = false

[[bin]]
name = "rt-tracer"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tracer-protocol = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
base64 = "0.22"
# The hook shim's 32-byte proof challenge (`hook.rs`).
getrandom = "0.3"
portable-pty = "0.9"
clap = { version = "4", features = ["derive"] }
# Cross-platform local-socket transport for the daemon↔tracer IPC: named
# pipes on Windows, Unix domain sockets on macOS/Linux. Replaces the
# Windows-only tokio::net::windows::named_pipe layer.
interprocess = { version = "2", features = ["tokio"] }

[target.'cfg(windows)'.dependencies]
# Job objects: bundle the child + every descendant into one kill scope
# so killing the PTY child (or the tracer exiting) also takes out node,
# cargo, pnpm, dev servers, etc. Without this, those grandchildren keep
# files locked inside the worktree and break the cleanup path.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# The UTF-16 forms of the security descriptor string the pipe is created with,
# and the one the tests read back. Interprocess 2.4.2 already pulls it.
widestring = "1.0.2"

[target.'cfg(unix)'.dependencies]
# The Unix equivalent of the Windows kill-on-close job object: portable-pty
# makes the PTY child a session leader (setsid), so on a stop the tracer reads
# every process in that session (`getsid`, `getpgid`, `killpg` and `kill` from
# libc; pid, parent and start time from sysinfo, the version the daemon uses)
# and kills them, background jobs in groups of their own included, so dev
# servers and their grandchildren do not pin worktree files open.
libc = "0.2"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
