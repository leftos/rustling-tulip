[package]
name = "agent-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Claude Code agent plugin: argv, hook settings and stream-json parsing"
publish = false

[lib]
doctest = false

[lints]
workspace = true

[features]
# The plugin's fake CLI (`fake/`), handed to the live test tier by `fake_cli`.
test-support = ["agent-api/test-support"]

[dependencies]
agent-api = { workspace = true }
chrono = { workspace = true }
# The account store the accounts service reads, and the transport traits it
# implements.
claude-accounts = { workspace = true }
directories = { workspace = true }
# The clock the account poll reads, and the HTTP-date `Retry-After` parse.
jiff = "0.2.37"
# The process table the account engine checks a lease holder against.
proc-table = { workspace = true }
protocol = { workspace = true }
regex = "1.11"
# The account transports' HTTP client: blocking, rustls on the `ring` backend
# with the OS's root certificates, as the daemon's summarizer client is.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "blocking",
] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
# The SHA-256 of the config dir that names Claude Code's Keychain service on
# macOS; the version claude-accounts already uses.
sha2 = "0.11.0"
tracing = { workspace = true }
# The NFC form of the config dir that Claude Code hashes for its Keychain
# service name.
unicode-normalization = "0.1.26"
uuid = { workspace = true }
# Zeroes the transports' response buffers, which may hold tokens.
zeroize = "1.9.0"

[dev-dependencies]
agent-api = { workspace = true, features = ["test-support"] }
# The runtime thread the account service is dropped on in its drop test.
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# The live process table the account engine checks a lease holder against on
# macOS. The same version and features the daemon reads its process list with,
# so the lockfile gains no second copy.
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
