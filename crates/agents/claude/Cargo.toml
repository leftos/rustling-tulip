[package]
name = "agent-claude"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The Claude Code agent plugin: argv, hook settings and stream-json parsing"
publish = false

[lib]
doctest = false

[lints]
workspace = true

[features]
# The plugin's fake CLI (`fake/`), handed to the live test tier by `fake_cli`.
test-support = ["agent-api/test-support"]

[dependencies]
agent-api = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
agent-api = { workspace = true, features = ["test-support"] }
regex = "1.11"
