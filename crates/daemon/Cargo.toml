[package]
name = "daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rustling-tulip background daemon: WS server, PTY pool, session/repo registry"
publish = false

[[bin]]
name = "rustling-tulipd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
protocol = { workspace = true }
tracer-protocol = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }

axum = { version = "0.8", features = ["ws"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
base64 = "0.22"
rand = "0.8"
portable-pty = "0.9"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
which = "8.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
notify = "8"
notify-debouncer-full = "0.7"
regex = "1.11"
sha2 = "0.10"

# TLS for the opt-in LAN listener. Pinned to the `ring` crypto backend to match
# the backend already resolved via reqwest (rustls-tls) — keeps `aws-lc-sys`
# (and its NASM/CMake build requirement) out of the tree.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# TLS-terminating server for the LAN listener. `tls-rustls-no-provider` keeps us
# on the `ring` provider we build the ServerConfig with (no aws-lc default).
axum-server = { version = "0.8", default-features = false, features = [
    "tls-rustls-no-provider",
] }
# Enumerate the host's non-loopback IPv4 addresses for the LAN connection code.
local-ip-address = "0.6"
# Advertise the LAN listener over mDNS so laptops can discover it without a
# hand-typed address (see crates/daemon/src/discovery.rs).
mdns-sd = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Restart Manager API for locating processes holding handles inside the
# worktrees directory after a `git worktree remove` fails. 0.61 matches
# the version already pulled transitively by the existing dep graph.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_RestartManager",
] }
