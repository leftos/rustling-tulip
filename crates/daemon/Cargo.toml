[package]
name = "daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "rustling-tulip background daemon: WS server, PTY pool, session/repo registry"
publish = false

[[bin]]
name = "rustling-tulipd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
protocol = { workspace = true }
tracer-protocol = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }

axum = { version = "0.8", features = ["ws"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
base64 = "0.22"
rand = "0.8"
portable-pty = "0.9"
# Cross-platform local-socket transport for the daemon↔tracer IPC: named
# pipes on Windows, Unix domain sockets on macOS/Linux. Replaces the
# Windows-only tokio::net::windows::named_pipe layer.
interprocess = { version = "2", features = ["tokio"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
which = "8.0"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
notify = "8"
notify-debouncer-full = "0.7"
regex = "1.11"
sha2 = "0.10"
# Cross-platform credential-store API. `crates/daemon/src/env_secrets.rs` files
# sealed environment-row values under Windows Credential Manager; the platform
# store itself is `windows-native-keyring-store` below.
keyring-core = "1.0"

# TLS for the opt-in LAN listener. Pinned to the `ring` crypto backend to match
# the backend already resolved via reqwest (rustls-tls) — keeps `aws-lc-sys`
# (and its NASM/CMake build requirement) out of the tree.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
    "logging",
] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# TLS-terminating server for the LAN listener. `tls-rustls-no-provider` keeps us
# on the `ring` provider we build the ServerConfig with (no aws-lc default).
axum-server = { version = "0.8", default-features = false, features = [
    "tls-rustls-no-provider",
] }
# Enumerate the host's non-loopback IPv4 addresses for the LAN connection code.
local-ip-address = "0.6"
# Advertise the LAN listener over mDNS so laptops can discover it without a
# hand-typed address (see crates/daemon/src/discovery.rs).
mdns-sd = { workspace = true }

[dev-dependencies]
# `test-util` enables the paused clock (`#[tokio::test(start_paused = true)]`)
# used by the idle-exit watcher tests to fast-forward through grace periods.
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager as the `keyring-core` store. Default features off
# drops its regex-backed credential search, which the daemon never uses: the
# index file in the config dir is how it knows which ids exist.
windows-native-keyring-store = { version = "1.1", default-features = false }
# Restart Manager API for locating processes holding handles inside the
# worktrees directory after a `git worktree remove` fails, plus the Power
# API (`SetThreadExecutionState`) backing the keep-awake hold that stops the
# host idle-sleeping while a session is live, plus the Registry API
# (`RegGetValueW`) reading user-scope environment variables for spawn-env
# references. 0.61 matches the version already pulled transitively by the
# existing dep graph.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RestartManager",
] }
