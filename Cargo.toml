[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/tracer-protocol",
    "crates/tracer",
    "crates/daemon",
    "crates/daemon-client",
    "crates/tailnet",
    "crates/update-core",
    "crates/agents/api",
    "crates/agents/claude",
    "crates/agents/claude/accounts",
    "crates/agents/registry",
    "crates/dev-daemon",
    "apps/native",
    "tools/rt-driver-mcp",
    "tools/folder-bench",
    "tools/protocol-ts",
]
exclude = ["vendor/gpui"]

[workspace.package]
version = "0.13.0-alpha"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["leftos <leftos@gmail.com>"]
repository = "https://github.com/leftos/rustling-tulip"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
semver = "1.0.28"
tar = { version = "0.4.46", default-features = false }
zstd = { version = "0.14.3", default-features = false }
# leftos/gate's crates, all at one rev so they share one git source and one lock entry.
gate-state = { git = "https://github.com/leftos/gate", rev = "15659c9e38a82270688c3371af2c5b6d7c19a0b6" }
proc-table = { git = "https://github.com/leftos/gate", rev = "15659c9e38a82270688c3371af2c5b6d7c19a0b6" }

protocol = { path = "crates/protocol" }
tracer-protocol = { path = "crates/tracer-protocol" }
daemon-client = { path = "crates/daemon-client" }
tailnet = { path = "crates/tailnet" }
update-core = { path = "crates/update-core" }
agent-api = { path = "crates/agents/api" }
agent-claude = { path = "crates/agents/claude" }
claude-accounts = { path = "crates/agents/claude/accounts" }
agent-registry = { path = "crates/agents/registry" }
dev-daemon = { path = "crates/dev-daemon" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Tests build with `--profile test-release`: optimised like release, but LTO and a single codegen unit
# made every test rebuild take ~4 minutes; this one rebuilds an edit in ~15 seconds.
[profile.test-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

[patch.crates-io]
gpui = { path = "vendor/gpui" }
